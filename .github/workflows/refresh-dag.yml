name: Refresh dependency DAGs

# Re-reads each team's Smartsheet tracker and commits any change to the generated
# artifacts, so the published pages track the sheets without anyone running the
# generators by hand. Teams come from tools/teams.py.
on:
  schedule:
    # 07:00 UTC on weekdays - after a meeting day, before the next morning.
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dag
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # generators are stdlib only, no install step

      - name: Check the token is configured
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
        run: |
          if [ -z "$SMARTSHEET_ACCESS_TOKEN" ]; then
            echo "::error::SMARTSHEET_ACCESS_TOKEN is not set. Add it under" \
                 "Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Refresh snapshots from the live trackers
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
        # Snapshots first: build_index.py counts progress from them, not from the
        # sheets, so a stale snapshot would report 0% no matter what the DAG shows.
        run: |
          python3 tools/export_snapshot.py --team embedded
          python3 tools/export_snapshot.py --team electronics

      - name: Rebuild both DAGs
        # Offline from the snapshots just refreshed, so the DAG and the progress
        # numbers are guaranteed to describe the same read of each sheet.
        run: |
          python3 tools/build_dependency_dag.py --team embedded
          python3 tools/build_dependency_dag.py --team electronics

      - name: Rebuild the example render
        run: |
          python3 tools/build_dependency_dag.py \
            --csv data/tracker-snapshot.example.csv \
            --basename dependency-dag.example \
            --note "ILLUSTRATIVE EXAMPLE - the edges below are sample dependencies, not real tracker data. Shown to demonstrate how a populated DAG renders."

      - name: Rebuild the landing page
        run: python3 tools/build_index.py

      - name: Discard timestamp-only churn
        # Every generated page carries a "generated <time> UTC" stamp, so a
        # rebuild always dirties the tree even when the trackers did not move.
        # Left alone this job would commit three large HTML files every weekday
        # morning forever. Revert any file whose ONLY changed lines are that
        # stamp, so the commit guard below sees a genuinely unchanged tree.
        run: |
          for f in $(git diff --name-only -- agile-planning index.html); do
            if [ -z "$(git diff -U0 -- "$f" | grep '^[+-][^+-]' | grep -v 'generated ')" ]; then
              git checkout -- "$f"
              echo "reverted timestamp-only change: $f"
            fi
          done

      - name: Commit any change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- agile-planning data index.html; then
            echo "trackers unchanged; nothing to commit"
            exit 0
          fi
          git add agile-planning data index.html
          git commit -m "Refresh dependency DAGs from the Smartsheet trackers

          Generated by .github/workflows/refresh-dag.yml."
          git push
