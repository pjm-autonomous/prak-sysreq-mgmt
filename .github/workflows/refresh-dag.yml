name: Refresh dependency DAGs

# Re-reads each team's Smartsheet tracker and commits any change to the generated
# artifacts, so the published pages track the sheets without anyone running the
# generators by hand. Teams come from tools/teams.py.
on:
  schedule:
    # 07:00 / 12:00 / 17:00 Mountain, weekdays: before the day starts, over
    # lunch, and after the afternoon review meetings.
    #
    # GitHub cron is UTC-only and has no DST, so these are pinned to MDT
    # (UTC-6) - what Logan is on from mid-March to early November. Through the
    # MST months each run lands an hour earlier in local terms (06:00 / 11:00 /
    # 16:00). For a DAG refresh that drift is immaterial; shift all three by an
    # hour twice a year if it ever matters.
    #
    # Pinning to MDT rather than MST also keeps the last run on the same UTC
    # day as the local one: at UTC-7 the 17:00 slot would be 00:00 the next
    # day, so "1-5" would silently skip Friday evening and add Sunday evening.
    - cron: "0 13 * * 1-5"      # 07:00 MDT / 06:00 MST
    - cron: "0 18 * * 1-5"      # 12:00 MDT / 11:00 MST
    - cron: "0 23 * * 1-5"      # 17:00 MDT / 16:00 MST
  workflow_dispatch:
  # Callable so refresh-on-comment.yml reuses this definition instead of
  # duplicating it. A GITHUB_TOKEN cannot trigger workflow_dispatch (GitHub
  # blocks that to prevent loops), so workflow_call is the way one workflow
  # runs another.
  workflow_call:

permissions:
  contents: write

concurrency:
  group: refresh-dag
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The landing page's change digest diffs committed snapshots
          # against recent history. The default depth-1 checkout has none,
          # so the digest would silently render empty on every run.
          fetch-depth: 50

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"      # generators are stdlib only, no install step

      - name: Is the Smartsheet token configured?
        id: smartsheet
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
        # A missing token is a known, expected state - the account that would
        # mint it is not provisioned yet - so it is a notice, not a failure. A
        # red X every weekday morning is how a scheduled job trains everyone to
        # ignore it, and then a real failure goes unread too.
        #
        # The rest of the job still runs. Capability ids, titles, priorities and
        # Jira keys come from prak-v-model, not from Smartsheet, so a rebuild can
        # legitimately change the published pages even when no tracker was
        # re-read. Only the snapshot pull is skipped.
        run: |
          if [ -n "$SMARTSHEET_ACCESS_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SMARTSHEET_ACCESS_TOKEN is not set - skipping the tracker pull and rebuilding from the committed snapshots. Add it under Settings > Secrets and variables > Actions to enable the live refresh."
            {
              echo "### Tracker pull skipped"
              echo
              echo "\`SMARTSHEET_ACCESS_TOKEN\` is not configured, so the committed"
              echo "snapshots under \`data/<team>/\` were used as-is. Progress numbers"
              echo "on the landing page reflect the last manual refresh, not the live"
              echo "sheets. Everything else in this run is current."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check out prak-v-model for capability metadata
        # Capability ids (CAP-nn), titles, MoSCoW priorities and Jira Initiative
        # keys all come from capreq-*.md frontmatter in asirobots/prak-v-model -
        # that repo is the source of record, nothing about a capability is
        # maintained by hand here. It is INTERNAL and this repo is public, so
        # the checkout needs a credential.
        #
        # Credential history, so this is not relitigated: a read-only deploy key
        # would be tighter - scoped to one repo by construction rather than by
        # configuration - but asirobots disables deploy keys by org/enterprise
        # policy (HTTP 422 "Deploy keys are disabled for this repository",
        # checked 2026-08-26).
        #
        # VMODEL_READ_TOKEN currently holds a SHARED fine-grained PAT that also
        # serves other tooling and carries read well beyond this repo's contents.
        # Two consequences worth knowing: its blast radius is wider than this job
        # needs, and rotating it elsewhere silently degrades this job - which is
        # what the check step below exists to surface. Narrowing it to a
        # dedicated Contents:Read token is tracked in TODO.md.
        #
        # continue-on-error, not a hard failure: without the secret the
        # generators fall back to the committed cache in data/shared/ and say so
        # on stderr. A refresh with slightly stale capability labels beats no
        # refresh at all, and the tracker data - which is what this job exists
        # to pull - is unaffected either way.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: asirobots/prak-v-model
          ref: main
          token: ${{ secrets.VMODEL_READ_TOKEN }}
          path: .vmodel

      - name: Did the capability source land?
        # The checkout above is continue-on-error, so a revoked, rotated or
        # expired credential drops this job to cached capability labels with
        # nothing going red. The generators do say so on stderr, but nobody
        # reads the logs of a green run - put it where it will be seen.
        run: |
          if [ -d "$GITHUB_WORKSPACE/.vmodel/product/requirements/product" ]; then
            echo "capability source checked out at .vmodel"
          else
            echo "::notice::prak-v-model was not checked out - capability labels and Jira keys come from the committed cache in data/shared/ and may be stale. Check VMODEL_READ_TOKEN: missing, expired, rotated, or lacking Contents:Read on asirobots/prak-v-model."
            {
              echo "### Capability source unavailable"
              echo
              echo "\`asirobots/prak-v-model\` was not checked out, so capability ids,"
              echo "titles, priorities and Jira keys came from the committed cache in"
              echo "\`data/shared/capability-meta.json\` and may be stale."
              echo
              echo "Check \`VMODEL_READ_TOKEN\` - missing, expired, rotated by the other"
              echo "tooling that shares it, or lacking Contents:Read on the repo."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh snapshots from the live trackers
        if: steps.smartsheet.outputs.available == 'true'
        env:
          SMARTSHEET_ACCESS_TOKEN: ${{ secrets.SMARTSHEET_ACCESS_TOKEN }}
        # Snapshots first: build_index.py counts progress from them, not from the
        # sheets, so a stale snapshot would report 0% no matter what the DAG shows.
        # The team list comes from tools/teams.py, so onboarding a team needs no
        # edit here: only teams with refresh: True are pulled.
        run: |
          for t in $(python3 tools/teams.py --refreshable); do
            python3 tools/export_snapshot.py --team "$t"
          done

      - name: Validate the trackers
        # Runs after the snapshot pull, before the build, so a tracker fault is
        # named rather than published as a plausible-looking diagram. Does NOT
        # fail the job: the previous snapshot is already committed and the site
        # should keep serving, so a data fault is reported and the refresh
        # continues. The job summary is where an SE will actually see it.
        id: validate
        continue-on-error: true
        run: |
          set +e
          python3 tools/validate_tracker.py > validation.txt 2>&1
          status=$?
          set -e
          cat validation.txt
          {
            if [ "$status" -eq 0 ]; then
              echo "### Tracker validation: clean"
            else
              echo "### Tracker validation: problems found"
              echo
              echo "These do not stop the refresh, but the published DAGs will"
              echo "reflect them until the tracker is corrected."
            fi
            echo
            echo '```'
            cat validation.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f validation.txt

      - name: Rebuild every DAG, plus the example render
        # Offline from the committed snapshots - the ones just refreshed above if
        # the token was set, otherwise the ones already in the tree - so each DAG
        # and the progress numbers always describe the same read of that sheet.
        # Teams registered but not yet onboarded have no snapshot: they print a
        # note and are skipped.
        run: |
          for t in $(python3 tools/teams.py --all); do
            python3 tools/build_dependency_dag.py --team "$t" \
              --vmodel "$GITHUB_WORKSPACE/.vmodel"
          done

      - name: Rebuild the landing page
        run: python3 tools/build_index.py

      - name: Discard timestamp-only churn
        # Every generated page carries a "generated <time> UTC" stamp, so a
        # rebuild always dirties the tree even when the trackers did not move.
        # Left alone this job would commit three large HTML files every weekday
        # morning forever. Revert any file whose ONLY changed lines are that
        # stamp, so the commit guard below sees a genuinely unchanged tree.
        run: |
          for f in $(git diff --name-only -- agile-planning index.html); do
            if [ -z "$(git diff -U0 -- "$f" | grep '^[+-][^+-]' | grep -v 'generated ')" ]; then
              git checkout -- "$f"
              echo "reverted timestamp-only change: $f"
            fi
          done

      - name: Commit any change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- agile-planning data index.html; then
            echo "trackers unchanged; nothing to commit"
            exit 0
          fi
          git add agile-planning data index.html
          if [ "${{ steps.smartsheet.outputs.available }}" = "true" ]; then
            subject="Refresh dependency DAGs from the Smartsheet trackers"
            source="Trackers re-read over the Smartsheet API."
          else
            # Say so plainly: on these runs the only thing that can have moved is
            # the capability layer from prak-v-model. Reading this in git log
            # later, "from the trackers" would be a lie about provenance.
            subject="Rebuild dependency DAGs from capability metadata"
            source="SMARTSHEET_ACCESS_TOKEN not set - trackers were not re-read; the committed snapshots were used as-is."
          fi
          git commit -m "$subject" -m "$source" \
                     -m "Generated by .github/workflows/refresh-dag.yml."
          git push
